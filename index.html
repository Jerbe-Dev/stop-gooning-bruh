<!-- Cloud streak sync protection: 2026-11-11 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Goon Logbook</title>
<meta name="description" content="A free streak tracker with an urge mode, a distraction picker, daily check-ins and milestones, with private GitHub cloud sync.">

<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
.lock-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg)}
body.locked .lock-screen{display:flex}
body.locked #app,body.locked .bar{display:none!important}
.lock-card{width:min(100%,520px);padding:26px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.lock-card h1{margin:18px 0 8px}.lock-card .lbl{display:block;margin:18px 0 8px}
.lock-card input{width:100%}.lock-card button{margin-top:22px}
</style>
</head>
<body class="locked">
<div id="lockScreen" class="lock-screen">
  <form id="unlockForm" class="lock-card">
    <span class="mark">Goon Logbook</span>
    <h1>Private access</h1>
    <p class="muted">Connect your GitHub account to sync your data across devices.</p>
    <div id="tokenEntry" hidden>
      <label class="lbl" for="unlockToken">GitHub token</label>
      <input id="unlockToken" type="password" autocomplete="off" placeholder="Paste your fine-grained token">
      <p class="muted sm">Needed once per device. It is saved only in this browser.</p>
    </div>
    <button class="btn btn-primary wide" type="submit">Connect Goon Logbook</button>
    <p id="unlockStatus" class="muted sm" role="status"></p>
    <p class="muted sm">Your token is saved only in this browser on this device. Your backup is stored as readable JSON in your private GitHub repository.</p>
  </form>
</div>
<div id="app">
  <header class="top"><span class="mark">Goon Logbook</span><span class="date" id="hdrDate"></span></header>
  <main>
    <section id="tab-today" class="tab" aria-label="Today"></section>
    <section id="tab-urge" class="tab" aria-label="Urge mode" hidden></section>
    <section id="tab-journey" class="tab" aria-label="Journey" hidden></section>
    <section id="tab-log" class="tab" aria-label="Log" hidden></section>
    <section id="tab-more" class="tab" aria-label="More" hidden></section>
  </main>
</div>
<nav class="bar" aria-label="Sections">
  <div class="bar-in">
    <button class="nb on" data-act="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Today</span></button>
    <button class="nb urgenb" data-act="tab" data-tab="urge" type="button"><svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.2c0 4.7-3.2 8.2-7.5 9.8-4.3-1.6-7.5-5.1-7.5-9.8V6z"/></svg><span>Urge</span></button>
    <button class="nb" data-act="tab" data-tab="journey" type="button"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2.2 4L17 13H6"/></svg><span>Journey</span></button>
    <button class="nb" data-act="tab" data-tab="log" type="button"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg><span>Log</span></button>
    <button class="nb" data-act="tab" data-tab="more" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>More</span></button>
  </div>
</nav>
<div id="sheetWrap" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/app.js?v=urge-persist-3"></script>
</body>
</html>
